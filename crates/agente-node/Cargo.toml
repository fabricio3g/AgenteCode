[package]
name = "agente-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native Node/Electron bindings for Agente agent runtime"

[lib]
crate-type = ["cdylib"]
test = false

[dependencies]
agente-core = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
napi = { version = "2", features = ["tokio_rt"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
