# MiniMax supports automatic prefix caching; M2 also supports explicit markers.
id = "minimax"
name = "MiniMax"
group = "cloud"
base_url = "https://api.minimax.io/anthropic/v1"
api_format = "anthropic"
env = ["MINIMAX_API_KEY"]
match_hosts = ["api.minimax.io"]
models = "catalog"
thinking = "default"
offered = true
order = 40
key_url = "https://platform.minimax.io/user-center/basic-information/interface-key"
docs_url = "https://platform.minimax.io/docs/api-reference/text-openai-api"
openai_compatible_url = "https://api.minimax.io/v1"

[models_seed]
"MiniMax-M3" = { name = "MiniMax M3", context = 1000000 }
"MiniMax-M2.7" = { name = "MiniMax M2.7", context = 204800 }

# Default to automatic caching; the documented M2 family supports explicit markers.
# Keep this exception in data, never in the transport builder.
[transport.cache]
breakpoints = false
rules = [
  { model_prefix = "MiniMax-M2", format = "anthropic", breakpoints = true },
]
