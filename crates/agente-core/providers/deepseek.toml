# DeepSeek — api-docs.deepseek.com. Thinking: `thinking:{type}` + `reasoning_effort`.
id = "deepseek"
name = "DeepSeek"
group = "cloud"
base_url = "https://api.deepseek.com"
api_format = "openai"
env = ["DEEPSEEK_API_KEY"]
match_hosts = ["api.deepseek.com"]
models = "catalog"
thinking = "deepseek"
stream_usage = true
offered = true
order = 30
key_url = "https://platform.deepseek.com/api_keys"
docs_url = "https://api-docs.deepseek.com/"
# api-docs.deepseek.com/guides/thinking_mode — used only for models the API and
# models.dev don't describe.
default_reasoning = [{ type = "toggle" }, { type = "effort", values = ["high", "max"] }]

[models_seed]
"deepseek-flash" = { name = "DeepSeek Flash", context = 128000 }
"deepseek-v4-pro" = { name = "DeepSeek V4 Pro", context = 128000 }
