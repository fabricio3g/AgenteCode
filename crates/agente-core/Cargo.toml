[package]
name = "agente-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core business logic for Agente - agent runtime, providers, and tool system"

[features]
default = ["execution"]
# Native phone hosts share provider policy without project/process execution.
execution = ["dep:processkit", "dep:rmcp", "dep:landlock", "dep:libc"]

[dependencies]
agente-protocol = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
schemars = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
glob = { workspace = true }
sha2 = { workspace = true }
base64 = "0.22"
dirs = { workspace = true }
parking_lot = { workspace = true }
tokio-util = { workspace = true }
tempfile = { workspace = true }
similar = { workspace = true }
processkit = { workspace = true, optional = true }
ignore = { workspace = true }
http = "1"
hyper = { version = "0.14", default-features = false, features = ["client", "tcp"] }
rmcp = { version = "3.4", optional = true, default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
scraper = "0.20"
encoding_rs = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
# The bot sandbox (src/sandbox/linux.rs): Landlock rules and the seccomp filter.
landlock = { version = "0.4.4", optional = true }
libc = { version = "0.2", optional = true }

[[example]]
name = "tool_performance"
required-features = ["execution"]

[lints]
workspace = true
