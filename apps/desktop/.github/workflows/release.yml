name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            artifact_name: chatealm-linux
          - os: windows-latest
            name: windows
            artifact_name: chatealm-windows
          - os: macos-latest
            name: macos
            artifact_name: chatealm-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install renderer deps
        run: npm ci
        working-directory: renderer

      - name: Inject Linux maintainer metadata (CI only)
        if: matrix.name == 'linux'
        run: |
          npm pkg set author.name="Chatea LM"
          npm pkg set author.email="ci@local.invalid"
          npm pkg set "build.linux.maintainer=Chatea LM <ci@local.invalid>"

      - name: Install Linux native build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            git \
            libvulkan-dev \
            glslang-tools \
            pkg-config

      - name: Install Windows native build dependencies
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          choco install cmake ninja vulkan-sdk -y --no-progress

      - name: Install macOS native build dependencies
        if: matrix.name == 'macos'
        run: brew install cmake ninja

      - name: Install CUDA toolkit
        if: matrix.name == 'linux' || matrix.name == 'windows'
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.6.3'
          method: network
          sub-packages: ${{ matrix.name == 'windows' && 'nvcc_12.6 cudart_12.6 cublas_12.6 cublas_dev_12.6' || 'nvcc_cu12.6 cudart_cu12.6 cublas_cu12.6 cublas_dev_cu12.6' }}

      - name: Build bundled native runtimes
        run: npm run build:native-runtimes
        env:
          NATIVE_RUNTIME_PLATFORM: ${{ matrix.name }}
          NATIVE_RUNTIME_ARCH: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          NATIVE_RUNTIME_BACKENDS: ${{ vars.NATIVE_RUNTIME_BACKENDS }}
          LLAMA_CPP_REF: ${{ vars.LLAMA_CPP_REF || 'master' }}
          WHISPER_CPP_REF: ${{ vars.WHISPER_CPP_REF || 'master' }}

      - name: Build Electron app
        run: npm run build:main && npm run build:renderer && npx electron-builder --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist-electron/**/*.AppImage
            dist-electron/**/*.deb
            dist-electron/**/*.exe
            dist-electron/**/*.dmg
            dist-electron/**/*.zip
            dist-electron/**/*.yml
            dist-electron/**/*.blockmap
          if-no-files-found: warn

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.yml
            release-assets/**/*.blockmap
          generate_release_notes: true
