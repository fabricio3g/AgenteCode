[package]
name = "desktop-egui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Agente Desktop ported to egui (native Rust GUI, 1:1 Electron port)"

[[bin]]
name = "agente-desktop-egui"
path = "src/main.rs"

[lib]
name = "desktop_egui"
path = "src/lib.rs"

[dependencies]
eframe = "0.36"
egui = "0.36"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
anyhow = { workspace = true }
agente-core = { workspace = true }
agente-protocol = { workspace = true }
agente-session = { workspace = true }
egui-phosphor = "0.14.0"
pulldown-cmark = "0.13.4"
reqwest = { workspace = true }
futures = { workspace = true }
arboard = { workspace = true }
image = { version = "0.25.10", default-features = false, features = ["png"] }
ignore.workspace = true

[lints]
workspace = true
