# The Kotlin compiler runs in this JVM (`in-process`), so the heap and the
# metaspace both have to hold a Compose build: 512m/256m ran out of metaspace
# once the design system and its screens landed.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
