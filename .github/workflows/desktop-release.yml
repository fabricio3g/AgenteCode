name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            artifact_name: agente-desktop-linux
          - os: windows-latest
            name: windows
            artifact_name: agente-desktop-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Linux runner disk space
        if: matrix.name == 'linux'
        run: |
          df -h .
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .

      - name: Tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $version"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/renderer/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install renderer deps
        run: npm ci
        working-directory: apps/desktop/renderer

      - name: Inject Linux maintainer metadata (CI only)
        if: matrix.name == 'linux'
        run: |
          npm pkg set author.name="Agente"
          npm pkg set author.email="ci@local.invalid"
          npm pkg set "build.linux.maintainer=Agente <ci@local.invalid>"

      - name: Fetch bundled llama.cpp and whisper.cpp
        # Prebuilt binaries from the upstream GitHub releases, checksum-verified
        # (see scripts/fetch-native-runtimes.mjs); nothing is compiled here.
        run: npm run fetch:native-runtimes
        env:
          NATIVE_RUNTIME_PLATFORM: ${{ matrix.name }}
          NATIVE_RUNTIME_ARCH: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          NATIVE_RUNTIME_BACKENDS: ${{ vars.NATIVE_RUNTIME_BACKENDS }}
          LLAMA_CPP_TAG: ${{ vars.LLAMA_CPP_TAG }}
          WHISPER_CPP_TAG: ${{ vars.WHISPER_CPP_TAG }}
          AUDIO_CPP_TAG: ${{ vars.AUDIO_CPP_TAG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build and bundle the Agente runtime
        run: npm run build:agente

      - name: Remove Linux compiler output after bundling
        if: matrix.name == 'linux'
        run: |
          test -x resources/bin/agente
          rm -rf ../../target
          df -h .

      - name: Build Electron app
        run: npm run build:main && npm run build:renderer && npx electron-builder --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ~1 GB of bundled llama.cpp builds is more than Node's default heap.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Check required installers and write checksums
        shell: bash
        run: |
          cd release
          if [ "${{ matrix.name }}" = linux ]; then
            test -s Agente-linux-x86_64.AppImage
            test -s Agente-linux-amd64.deb
          else
            test -s Agente-win-x64.exe
            test -s Agente-win-x64.exe.blockmap
            test -s latest.yml
          fi
          shopt -s nullglob
          files=( *.AppImage *.deb *.exe *.zip *.yml *.blockmap )
          sha256sum "${files[@]}" > "SHA256SUMS-${{ matrix.name }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
            apps/desktop/release/SHA256SUMS-*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Desktop checksums
        run: cat release-assets/SHA256SUMS-* > release-assets/DESKTOP_SHA256SUMS

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.exe
            release-assets/*.zip
            release-assets/*.yml
            release-assets/*.blockmap
            release-assets/DESKTOP_SHA256SUMS
          generate_release_notes: true
