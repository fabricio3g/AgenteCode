name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build and verify
        type: choice
        default: all
        options: [all, linux, windows]
      code_run_id:
        description: Optional successful Code run to reuse (Rust sources must match)
        type: string
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.name == 'linux' && 'ubuntu-latest' || 'windows-latest' }}
    defaults:
      run:
        working-directory: apps/desktop
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["linux","windows"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Linux runner disk space
        if: matrix.name == 'linux'
        run: |
          df -h .
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .

      - name: Tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $version"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/renderer/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install renderer deps
        run: npm ci
        working-directory: apps/desktop/renderer

      - name: Inject Linux maintainer metadata (CI only)
        if: matrix.name == 'linux'
        run: |
          npm pkg set author.name="Agente"
          npm pkg set author.email="ci@local.invalid"
          npm pkg set "build.linux.maintainer=Agente <ci@local.invalid>"

      - name: Fetch bundled llama.cpp and whisper.cpp
        # Prebuilt binaries from the upstream GitHub releases, checksum-verified
        # (see scripts/fetch-native-runtimes.mjs); nothing is compiled here.
        #
        # Packaging requires llama cpu/vulkan/cuda/sycl, audio/cpu and
        # whisper/cpu in resources/bin (`scripts/packaging.cjs`, release builds),
        # and the script bundles only audio unless the engines are named. The
        # release failed at "Missing release backend: llama/cpu" while this list
        # was missing, so it is part of the contract, not a convenience.
        run: npm run fetch:native-runtimes
        env:
          NATIVE_RUNTIME_PLATFORM: ${{ matrix.name }}
          NATIVE_RUNTIME_ARCH: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          NATIVE_RUNTIME_ENGINES: 'audio,llama,whisper'
          NATIVE_RUNTIME_BACKENDS: 'cpu,vulkan,cuda,sycl' # ROCm is downloaded through the UI.
          LLAMA_CPP_TAG: ${{ vars.LLAMA_CPP_TAG }}
          WHISPER_CPP_TAG: ${{ vars.WHISPER_CPP_TAG }}
          AUDIO_CPP_TAG: ${{ vars.AUDIO_CPP_TAG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust
        if: inputs.code_run_id == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        if: inputs.code_run_id == ''
        uses: Swatinem/rust-cache@v2

      - name: Build and bundle the Agente runtime
        if: inputs.code_run_id == ''
        run: npm run build:agente

      - name: Verify reused Code runtime sources
        if: inputs.code_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE_RUN_ID: ${{ inputs.code_run_id }}
        run: |
          [[ "$CODE_RUN_ID" =~ ^[0-9]+$ ]]
          result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CODE_RUN_ID" --jq .conclusion)
          test "$result" = success
          runtime_ref=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CODE_RUN_ID" --jq .head_sha)
          git diff --exit-code "$runtime_ref" HEAD -- Cargo.toml Cargo.lock .cargo crates assets packaging

      - name: Download verified Code runtime
        if: inputs.code_run_id != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.code_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: cli-${{ matrix.name == 'windows' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}
          path: apps/desktop/.runtime

      - name: Bundle verified Code runtime
        if: inputs.code_run_id != ''
        shell: bash
        run: |
          mkdir -p resources/bin
          if [ "${{ matrix.name }}" = windows ]; then
            (cd .runtime && sha256sum -c AgenteCode-windows-x64.exe.sha256)
            cp .runtime/AgenteCode-windows-x64.exe resources/bin/agente.exe
          else
            (cd .runtime && sha256sum -c AgenteCode-linux-x64.sha256)
            install -m755 .runtime/AgenteCode-linux-x64 resources/bin/agente
          fi

      - name: Remove Linux compiler output after bundling
        if: matrix.name == 'linux'
        run: |
          test -x resources/bin/agente
          rm -rf ../../target
          df -h .

      - name: Build packaged Electron app
        run: npm run build:main && npm run build:renderer && npx electron-builder --dir --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          AGENTE_RELEASE_BUILD: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ~1 GB of bundled llama.cpp builds is more than Node's default heap.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Packaged Windows startup
        if: matrix.name == 'windows'
        run: npm run smoke:packaged

      - name: Packaged Linux startup
        if: matrix.name == 'linux'
        env:
          AGENTE_SMOKE_SETUID: '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64
          xvfb-run -a npm run smoke:packaged

      - name: Build installers from verified app
        run: npx electron-builder --prepackaged release/${{ matrix.name == 'windows' && 'win' || 'linux' }}-unpacked --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Verify Desktop Debian install and remove
        if: matrix.name == 'linux'
        env:
          AGENTE_SMOKE_SETUID: '1'
        run: |
          sudo apt-get install -y ./release/AgenteDesktop-linux-amd64.deb
          installed=$(dpkg -L agente-desktop | awk '/^\/opt\/.*\/agente-desktop$/ {print; exit}')
          test -f "$installed"
          test -x "$installed"
          installed_dir=$(dirname "$installed")
          xvfb-run -a node scripts/smoke-packaged.mjs "$installed_dir"
          sudo dpkg --remove agente-desktop
          test ! -e "$installed"

      - name: Report packaged size
        run: npm run report:package

      - name: Upload startup diagnostics
        if: always()
        # Diagnostics, not deliverables: the account's artifact quota must not
        # turn a good build red.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: desktop-startup-${{ matrix.name }}
          path: apps/desktop/release/smoke-diagnostics/
          if-no-files-found: ignore

      - name: Check required installers and write checksums
        shell: bash
        run: |
          cd release
          if [ "${{ matrix.name }}" = linux ]; then
            test -s AgenteDesktop-linux-x64.AppImage
            test -s AgenteDesktop-linux-amd64.deb
          else
            test -s AgenteDesktop-windows-x64.exe
            test -s AgenteDesktop-windows-x64.exe.blockmap
            test -s latest.yml
            grep -q AgenteDesktop-windows-x64.exe latest.yml
          fi
          shopt -s nullglob
          files=( *.AppImage *.deb *.exe *.zip latest*.yml *.blockmap )
          sha256sum "${files[@]}" > "SHA256SUMS-${{ matrix.name }}"

      # Release assets go straight onto the draft release. Actions artifacts
      # share the account's storage quota (artifacts and caches); a full quota
      # failed the CLI upload with "Artifact storage quota has been hit" after
      # the binaries had already been built and verified. A release asset has no
      # such ceiling, and the publish job no longer has to move artifacts from
      # job to job.
      - name: Upload the installers to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --title "Agente $tag" --generate-notes || true
          gh release view "$tag" >/dev/null
          cd release
          shopt -s nullglob
          gh release upload "$tag" *.AppImage *.deb *.exe *.zip latest*.yml *.blockmap SHA256SUMS-* AgenteDesktop-size-*.json --clobber

      # Manual runs (no tag) keep their output as an artifact, best-effort.
      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: agente-desktop-${{ matrix.name }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/latest*.yml
            apps/desktop/release/*.blockmap
            apps/desktop/release/SHA256SUMS-*
            apps/desktop/release/AgenteDesktop-size-*.json
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Desktop checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" --pattern 'SHA256SUMS-*' --dir release-assets
          cat release-assets/SHA256SUMS-* > release-assets/AgenteDesktop-SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" release-assets/AgenteDesktop-SHA256SUMS --clobber

      - name: Verify the required assets are on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          names=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          echo "$names"
          for required in \
            AgenteDesktop-linux-x64.AppImage \
            AgenteDesktop-linux-amd64.deb \
            AgenteDesktop-windows-x64.exe \
            AgenteDesktop-windows-x64.exe.blockmap \
            latest.yml \
            AgenteDesktop-SHA256SUMS; do
            grep -qx "$required" <<<"$names" || { echo "Missing release asset: $required"; exit 1; }
          done
