name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            artifact_name: agente-desktop-linux
          - os: windows-latest
            name: windows
            artifact_name: agente-desktop-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $version"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/renderer/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install renderer deps
        run: npm ci
        working-directory: apps/desktop/renderer

      - name: Inject Linux maintainer metadata (CI only)
        if: matrix.name == 'linux'
        run: |
          npm pkg set author.name="Agente"
          npm pkg set author.email="ci@local.invalid"
          npm pkg set "build.linux.maintainer=Agente <ci@local.invalid>"

      - name: Fetch bundled llama.cpp and whisper.cpp
        # Prebuilt binaries from the upstream GitHub releases, checksum-verified
        # (see scripts/fetch-native-runtimes.mjs); nothing is compiled here.
        run: npm run fetch:native-runtimes
        env:
          NATIVE_RUNTIME_PLATFORM: ${{ matrix.name }}
          NATIVE_RUNTIME_ARCH: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          NATIVE_RUNTIME_BACKENDS: ${{ vars.NATIVE_RUNTIME_BACKENDS }}
          LLAMA_CPP_TAG: ${{ vars.LLAMA_CPP_TAG }}
          WHISPER_CPP_TAG: ${{ vars.WHISPER_CPP_TAG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build and bundle the Agente runtime
        run: npm run build:agente

      - name: Build Electron app
        run: npm run build:main && npm run build:renderer && npx electron-builder --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            apps/desktop/dist-electron/**/*.AppImage
            apps/desktop/dist-electron/**/*.deb
            apps/desktop/dist-electron/**/*.exe
            apps/desktop/dist-electron/**/*.zip
            apps/desktop/dist-electron/**/*.yml
            apps/desktop/dist-electron/**/*.blockmap
          if-no-files-found: warn

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.exe
            release-assets/**/*.zip
            release-assets/**/*.yml
            release-assets/**/*.blockmap
          generate_release_notes: true
