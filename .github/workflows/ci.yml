name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install renderer deps
        run: npm ci --prefix renderer

      - name: Run renderer type check
        run: npm run check
