name: Release

# A version tag (v1.2.3) publishes one GitHub release with Agente Code (the
# CLI) for Linux and Windows. The Desktop workflow adds its installers to
# the same release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: Agente Code · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: AgenteCode-linux-x64
            deb_arch: amd64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: AgenteCode-linux-arm64
            deb_arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: AgenteCode-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --bin agente --target ${{ matrix.target }}

      # The release ships the executable itself, under a name that stays the
      # same from version to version (so .../releases/latest/download/<name>
      # always works), with its SHA-256 beside it.
      - name: Collect the binary
        shell: bash
        run: |
          mkdir -p dist
          exe=agente; [ "${{ runner.os }}" = "Windows" ] && exe=agente.exe
          cp "target/${{ matrix.target }}/release/$exe" "dist/${{ matrix.asset }}"
          cd dist && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Package and verify Debian install
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          package="dist/AgenteCode-linux-${{ matrix.deb_arch }}.deb"
          scripts/package-code-deb.sh "target/${{ matrix.target }}/release/agente" "${{ matrix.deb_arch }}" "$version" "$package"
          sudo apt-get install -y "./$package"
          agente --version
          test -f /usr/share/applications/agente-code.desktop
          sudo dpkg --remove agente-code
          test ! -e /usr/bin/agente
          (cd dist && sha256sum "AgenteCode-linux-${{ matrix.deb_arch }}.deb" > "AgenteCode-linux-${{ matrix.deb_arch }}.deb.sha256")

      # Release assets go straight onto the draft release. Actions artifacts
      # share the account's storage quota (artifacts and caches), and a full
      # quota failed this upload with "Artifact storage quota has been hit"
      # after the binaries had already been built and verified. A release
      # asset has no such ceiling, and the publish job no longer needs to
      # hand artifacts from one job to another.
      - name: Upload the CLI assets to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --title "Agente $tag" --generate-notes || true
          gh release view "$tag" >/dev/null
          gh release upload "$tag" dist/* --clobber

      # Manual runs (no tag) keep their output as an artifact, best-effort: a
      # verification build must not fail on the storage quota.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        with:
          name: cli-${{ matrix.target }}
          path: dist/*

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: cli
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: One checksums file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p assets
          gh release download "$GITHUB_REF_NAME" --pattern '*.sha256' --dir assets
          cat assets/*.sha256 > assets/AgenteCode-SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" assets/AgenteCode-SHA256SUMS --clobber
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort
