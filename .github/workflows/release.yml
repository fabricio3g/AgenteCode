name: Release

# A version tag (v1.2.3) publishes one GitHub release with Agente Code (the
# CLI) for Linux and Windows. The Desktop workflow adds its installers to
# the same release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: Agente Code · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: agente-linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: agente-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: agente-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --bin agente --target ${{ matrix.target }}

      # The release ships the executable itself, under a name that stays the
      # same from version to version (so .../releases/latest/download/<name>
      # always works), with its SHA-256 beside it.
      - name: Collect the binary
        shell: bash
        run: |
          mkdir -p dist
          exe=agente; [ "${{ runner.os }}" = "Windows" ] && exe=agente.exe
          cp "target/${{ matrix.target }}/release/$exe" "dist/${{ matrix.asset }}"
          cd dist && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: cli
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: One checksums file
        run: |
          cat assets/*.sha256 > assets/SHA256SUMS
          rm assets/*.sha256

      - uses: softprops/action-gh-release@v2
        with:
          name: Agente ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            assets/agente-*
            assets/SHA256SUMS
